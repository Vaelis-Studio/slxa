<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slxa - AI Homework Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gptBg: '#212121',
                        gptSidebar: '#171717',
                        gptInput: '#2f2f2f',
                        gptHover: '#2a2a2a',
                        brandGreen: '#10a37f',
                        brandGreenHover: '#1a7f64',
                        userBubble: '#303030'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- KaTeX for High-Quality Algebra and Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #212121;
            color: #ececec;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }
        /* Markdown & Math formatting styles */
        .markdown-body {
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.65;
        }
        .markdown-body p {
            margin-bottom: 0.85rem;
        }
        .markdown-body p:last-child {
            margin-bottom: 0;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #f3f4f6;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body code:not(pre code) {
            background-color: #2f2f2f;
            color: #10a37f;
            padding: 0.15rem 0.35rem;
            border-radius: 0.375rem;
            font-size: 0.875em;
            font-family: monospace;
        }
        .markdown-body pre {
            background-color: #0d0d0d !important;
            border: 1px solid #333;
            border-radius: 0.5rem;
            padding: 0.85rem 1rem;
            margin: 0.75rem 0;
            overflow-x: auto;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body ol {
            list-style-type: decimal;
            padding-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body blockquote {
            border-left: 3px solid #10a37f;
            padding-left: 0.75rem;
            color: #9ca3af;
            font-style: italic;
            margin: 0.75rem 0;
        }
        /* Typing cursor effect */
        .typing-cursor::after {
            content: '●';
            color: #10a37f;
            animation: pulse 0.8s infinite;
            margin-left: 2px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        /* KaTeX Math Styling */
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0.5rem 0;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex overflow-hidden bg-gptBg text-slate-100 antialiased">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>

    <!-- Left Sidebar (Chat History & Options) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-gptSidebar flex flex-col border-r border-zinc-800 transition-transform duration-300 transform -translate-x-full md:translate-x-0">
        
        <!-- App Title / Header -->
        <div class="p-3 border-b border-zinc-800/80 flex items-center justify-between">
            <div class="flex items-center gap-2 px-2">
                <div class="w-7 h-7 rounded-lg bg-brandGreen flex items-center justify-center text-white font-bold text-sm">
                    s
                </div>
                <span class="font-bold text-lg text-white tracking-wide">slxa</span>
            </div>
            <button id="close-sidebar-btn" class="md:hidden p-2 text-zinc-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- New Chat Button -->
        <div class="p-3 pb-1">
            <button id="new-chat-btn" class="w-full flex items-center gap-2 px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-slate-200 rounded-lg text-sm font-medium transition border border-zinc-700/60">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>New chat</span>
            </button>
        </div>

        <!-- Chat Sessions List -->
        <div id="chat-sessions-list" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Dynamic chat sessions inserted here -->
        </div>

        <!-- Sidebar Footer Controls -->
        <div class="p-3 border-t border-zinc-800 space-y-3 bg-zinc-900/40 text-xs">
            
            <!-- Voice Speech Settings -->
            <div class="bg-zinc-800/60 rounded-lg p-2.5 space-y-2 border border-zinc-700/40">
                <div class="flex items-center justify-between">
                    <span class="font-semibold text-slate-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-volume-high text-brandGreen"></i> Read Responses
                    </span>
                    <input id="auto-speak-toggle" type="checkbox" class="w-4 h-4 accent-brandGreen rounded cursor-pointer">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] text-zinc-400">Speech Voice</label>
                    <select id="voice-select" class="w-full bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-brandGreen truncate">
                        <option value="">Default System Voice</option>
                    </select>
                </div>
            </div>

            <!-- Social Links & Creator Info -->
            <div class="px-2 py-1 text-[11px] text-zinc-400 space-y-1 bg-zinc-800/30 rounded-lg border border-zinc-800">
                <div class="flex items-center justify-between">
                    <span>Created by: <strong class="text-slate-200">eyob</strong></span>
                </div>
                <div class="flex items-center gap-2 text-zinc-300">
                    <i class="fa-brands fa-tiktok text-brandGreen"></i>
                    <i class="fa-brands fa-instagram text-brandGreen"></i>
                    <span>Follow: <strong class="text-brandGreen">slxa19</strong></span>
                </div>
            </div>

            <!-- Clear All Chats -->
            <button id="clear-all-sessions-btn" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-red-500/10 text-zinc-400 hover:text-red-400 transition text-xs">
                <i class="fa-solid fa-trash-can"></i>
                <span>Clear all conversations</span>
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-gptBg">
        
        <!-- Header Bar -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-zinc-800/80 bg-gptBg/90 backdrop-blur z-10">
            <div class="flex items-center gap-3">
                <button id="toggle-sidebar-btn" class="md:hidden text-zinc-400 hover:text-white p-1">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                
                <!-- Model Selector Dropdown -->
                <div class="relative inline-block">
                    <button id="model-dropdown-btn" class="flex items-center gap-2 text-sm font-semibold text-slate-200 hover:bg-zinc-800/80 px-3 py-1.5 rounded-lg transition">
                        <span id="current-model-name">slxa Standard (GPT-4o Vision)</span>
                        <i class="fa-solid fa-chevron-down text-xs text-zinc-400"></i>
                    </button>
                    <div id="model-dropdown-menu" class="hidden absolute top-full left-0 mt-1 w-64 bg-zinc-800 border border-zinc-700 rounded-xl shadow-2xl py-1 z-50">
                        <!-- Dynamic model options -->
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="stop-speaking-btn" class="hidden px-2.5 py-1 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500/30 text-xs font-medium flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-volume-xmark"></i> Stop Speech
                </button>
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-zinc-800 border border-zinc-700 text-xs text-zinc-300">
                    <span class="w-2 h-2 rounded-full bg-brandGreen animate-pulse"></span>
                    <span>slxa online</span>
                </div>
            </div>
        </header>

        <!-- Chat Scrolling Messages Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto px-4 md:px-0 py-6 space-y-6">
            <div id="messages-list" class="max-w-3xl mx-auto space-y-6"></div>
        </div>

        <!-- Sticky Bottom Chat Input Container -->
        <div class="p-4 bg-gptBg">
            <div class="max-w-3xl mx-auto relative">
                
                <!-- Attached Image Preview Container -->
                <div id="image-preview-container" class="hidden mb-2 relative inline-block">
                    <img id="image-preview" src="" alt="Homework preview" class="h-20 w-auto rounded-lg border border-brandGreen object-cover shadow-lg">
                    <button id="remove-image-btn" type="button" class="absolute -top-2 -right-2 bg-red-600 hover:bg-red-700 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow-md">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Chat Input Form -->
                <form id="chat-form" class="relative bg-gptInput border border-zinc-700/70 rounded-2xl p-2 shadow-2xl focus-within:border-zinc-500 transition">
                    <!-- File Input Hidden -->
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                    
                    <div class="flex items-end gap-2 px-1">
                        <!-- Upload Image Button -->
                        <button type="button" id="upload-image-btn" class="p-2 text-zinc-400 hover:text-brandGreen hover:bg-zinc-800 rounded-xl transition flex items-center justify-center" title="Upload Homework or Math Problem Image">
                            <i class="fa-solid fa-paperclip text-lg"></i>
                        </button>

                        <!-- Text Input -->
                        <textarea 
                            id="user-input" 
                            rows="1" 
                            placeholder="Ask slxa a homework question or upload an algebra problem..." 
                            class="w-full bg-transparent text-slate-100 placeholder-zinc-500 py-2 focus:outline-none resize-none max-h-40 text-sm md:text-base leading-relaxed"
                        ></textarea>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-1">
                            <button 
                                type="button" 
                                id="stop-btn" 
                                class="hidden w-8 h-8 rounded-full bg-zinc-700 hover:bg-zinc-600 text-slate-200 transition flex items-center justify-center text-xs"
                                title="Stop Generating"
                            >
                                <i class="fa-solid fa-square"></i>
                            </button>
                            <button 
                                type="submit" 
                                id="send-btn" 
                                class="w-8 h-8 rounded-full bg-white text-black hover:bg-slate-200 transition disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center text-xs font-bold"
                            >
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                </form>
                <div class="text-center mt-2 flex items-center justify-center gap-3 text-[11px] text-zinc-500">
                    <span>slxa by eyob • TikTok & Instagram: @slxa19</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Application JavaScript Logic -->
    <script>
        // System Persona Definition
        const INITIAL_GREETING = "Hello! I'm slxa, an AI created by eyob that can help you with your homework. Follow My TikTok and Instagram : slxa19";
        const SYSTEM_PROMPT = `You are "slxa", an advanced AI assistant created by "eyob". Your primary expertise is helping students with homework, algebra, mathematics, science, coding, and general study topics.
When solving math or algebra problems:
1. Provide step-by-step clear explanations.
2. Format all mathematical symbols and equations using LaTeX syntax enclosed in standard single dollar signs ($e=mc^2$) for inline math or double dollar signs ($$\\frac{a}{b}$$) for block math.
3. If an image is provided, carefully read the problem or handwritten algebra equations and solve them completely.
Always maintain a helpful, friendly, and smart persona.`;

        // Application State
        const state = {
            sessions: [],
            currentSessionId: null,
            isGenerating: false,
            abortController: null,
            selectedModel: 'openai',
            attachedBase64Image: null,
            autoSpeak: false,
            selectedVoice: null,
            availableVoices: [],
            availableModels: [
                { id: 'openai', name: 'slxa Standard (GPT-4o Vision)' },
                { id: 'qwen', name: 'Qwen AI (Math & Reasoning)' },
                { id: 'llama', name: 'Meta LLaMA 3' },
                { id: 'mistral', name: 'Mistral AI' },
                { id: 'deepseek', name: 'DeepSeek Reasoning' }
            ]
        };

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const messagesList = document.getElementById('messages-list');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const imageInput = document.getElementById('image-input');
        const uploadImageBtn = document.getElementById('upload-image-btn');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const removeImageBtn = document.getElementById('remove-image-btn');

        // Sidebar & Header DOM
        const sidebar = document.getElementById('sidebar');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');
        const chatSessionsList = document.getElementById('chat-sessions-list');
        const newChatBtn = document.getElementById('new-chat-btn');
        const clearAllSessionsBtn = document.getElementById('clear-all-sessions-btn');

        // Dropdowns & Voice DOM
        const modelDropdownBtn = document.getElementById('model-dropdown-btn');
        const modelDropdownMenu = document.getElementById('model-dropdown-menu');
        const currentModelName = document.getElementById('current-model-name');
        const autoSpeakToggle = document.getElementById('auto-speak-toggle');
        const voiceSelect = document.getElementById('voice-select');
        const stopSpeakingBtn = document.getElementById('stop-speaking-btn');

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            configureMarkdown();
            loadSpeechVoices();
            loadStateFromLocalStorage();
            renderModelDropdown();
            setupEventListeners();

            if (state.sessions.length === 0) {
                createNewSession();
            } else if (!state.currentSessionId) {
                switchSession(state.sessions[0].id);
            } else {
                switchSession(state.currentSessionId);
            }
        });

        // Markdown Setup
        function configureMarkdown() {
            marked.setOptions({
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                },
                langPrefix: 'hljs language-',
                breaks: true
            });
        }

        // Web Speech Voices Setup
        function loadSpeechVoices() {
            if ('speechSynthesis' in window) {
                const updateVoiceList = () => {
                    state.availableVoices = window.speechSynthesis.getVoices();
                    voiceSelect.innerHTML = '<option value="">Default System Voice</option>';
                    state.availableVoices.forEach((voice, index) => {
                        const opt = document.createElement('option');
                        opt.value = index;
                        opt.textContent = `${voice.name} (${voice.lang})`;
                        voiceSelect.appendChild(opt);
                    });
                };
                updateVoiceList();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = updateVoiceList;
                }
            } else {
                autoSpeakToggle.disabled = true;
            }
        }

        // Text-to-Speech Function
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            stopSpeakingBtn.classList.remove('hidden');

            // Strip mathematical markdown & code for fluid spoken reading
            const plainText = text.replace(/```[\s\S]*?```/g, ' Code snippet omitted. ')
                                  .replace(/\$\$[\s\S]*?\$\$/g, ' Math formula ')
                                  .replace(/\$[^$]+\$/g, ' formula ')
                                  .replace(/[*_~#]/g, '')
                                  .trim();

            if (!plainText) return;

            const utterance = new SpeechSynthesisUtterance(plainText);
            if (state.selectedVoice !== null && state.availableVoices[state.selectedVoice]) {
                utterance.voice = state.availableVoices[state.selectedVoice];
            }
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            utterance.onend = () => stopSpeakingBtn.classList.add('hidden');
            utterance.onerror = () => stopSpeakingBtn.classList.add('hidden');

            window.speechSynthesis.speak(utterance);
        }

        // Event Listeners
        function setupEventListeners() {
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if ((userInput.value.trim() || state.attachedBase64Image) && !state.isGenerating) {
                        chatForm.dispatchEvent(new Event('submit'));
                    }
                }
            });

            chatForm.addEventListener('submit', handleMessageSubmit);
            stopBtn.addEventListener('click', stopGeneration);
            stopSpeakingBtn.addEventListener('click', () => {
                window.speechSynthesis.cancel();
                stopSpeakingBtn.classList.add('hidden');
            });

            // Image Attachment Handlers
            uploadImageBtn.addEventListener('click', () => imageInput.click());
            imageInput.addEventListener('change', handleImageSelect);
            removeImageBtn.addEventListener('click', clearAttachedImage);

            // Sidebar & Navigation
            toggleSidebarBtn.addEventListener('click', openSidebar);
            closeSidebarBtn.addEventListener('click', closeSidebar);
            sidebarBackdrop.addEventListener('click', closeSidebar);
            newChatBtn.addEventListener('click', () => createNewSession());
            clearAllSessionsBtn.addEventListener('click', clearAllSessions);

            // Model Selector Dropdown
            modelDropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                modelDropdownMenu.classList.toggle('hidden');
            });
            document.addEventListener('click', () => modelDropdownMenu.classList.add('hidden'));

            // Voice Config
            autoSpeakToggle.addEventListener('change', (e) => {
                state.autoSpeak = e.target.checked;
                saveStateToLocalStorage();
            });
            voiceSelect.addEventListener('change', (e) => {
                state.selectedVoice = e.target.value !== "" ? parseInt(e.target.value) : null;
                saveStateToLocalStorage();
            });
        }

        // Image Attachment Handler
        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('Please select a valid image file.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                state.attachedBase64Image = event.target.result;
                imagePreview.src = event.target.result;
                imagePreviewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearAttachedImage() {
            state.attachedBase64Image = null;
            imageInput.value = '';
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
        }

        // Model Dropdown Renderer
        function renderModelDropdown() {
            modelDropdownMenu.innerHTML = '';
            state.availableModels.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-2 text-xs text-slate-200 hover:bg-zinc-700 transition flex items-center justify-between';
                btn.innerHTML = `<span>${m.name}</span> ${state.selectedModel === m.id ? '<i class="fa-solid fa-check text-brandGreen"></i>' : ''}`;
                btn.addEventListener('click', () => {
                    state.selectedModel = m.id;
                    currentModelName.textContent = m.name;
                    renderModelDropdown();
                    saveStateToLocalStorage();
                });
                modelDropdownMenu.appendChild(btn);
            });
        }

        // LocalStorage Management
        function saveStateToLocalStorage() {
            const dataToSave = {
                sessions: state.sessions,
                currentSessionId: state.currentSessionId,
                selectedModel: state.selectedModel,
                autoSpeak: state.autoSpeak,
                selectedVoice: state.selectedVoice
            };
            localStorage.setItem('slxa_chat_state', JSON.stringify(dataToSave));
        }

        function loadStateFromLocalStorage() {
            const saved = localStorage.getItem('slxa_chat_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.sessions = parsed.sessions || [];
                    state.currentSessionId = parsed.currentSessionId || null;
                    state.selectedModel = parsed.selectedModel || 'openai';
                    state.autoSpeak = parsed.autoSpeak || false;
                    state.selectedVoice = parsed.selectedVoice !== undefined ? parsed.selectedVoice : null;

                    autoSpeakToggle.checked = state.autoSpeak;
                    const mObj = state.availableModels.find(m => m.id === state.selectedModel);
                    if (mObj) currentModelName.textContent = mObj.name;
                } catch (e) {
                    console.error('Error loading stored chats', e);
                }
            }
        }

        // Sidebar Navigation
        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('hidden');
        }

        // Session Handling
        function createNewSession() {
            const newSession = {
                id: 'session-' + Date.now(),
                title: 'Homework Chat',
                messages: [
                    {
                        role: 'assistant',
                        content: INITIAL_GREETING
                    }
                ]
            };
            state.sessions.unshift(newSession);
            switchSession(newSession.id);
            closeSidebar();
        }

        function switchSession(sessionId) {
            state.currentSessionId = sessionId;
            renderSessionsList();
            renderMessages();
            saveStateToLocalStorage();
        }

        function clearAllSessions() {
            if (confirm('Are you sure you want to delete all chat history?')) {
                state.sessions = [];
                state.currentSessionId = null;
                createNewSession();
                showToast('All chat conversations cleared.', 'info');
            }
        }

        function renderSessionsList() {
            chatSessionsList.innerHTML = '';
            state.sessions.forEach(sess => {
                const isActive = sess.id === state.currentSessionId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition text-xs ${isActive ? 'bg-zinc-800 text-white font-medium' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-slate-200'}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-2 truncate flex-1">
                        <i class="fa-regular fa-message text-xs text-brandGreen"></i>
                        <span class="truncate">${escapeHtml(sess.title)}</span>
                    </div>
                    <button class="delete-sess-btn hidden group-hover:block p-1 text-zinc-500 hover:text-red-400 transition" title="Delete session">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;

                div.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-sess-btn')) return;
                    switchSession(sess.id);
                });

                div.querySelector('.delete-sess-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteSession(sess.id);
                });

                chatSessionsList.appendChild(div);
            });
        }

        function deleteSession(sessionId) {
            state.sessions = state.sessions.filter(s => s.id !== sessionId);
            if (state.sessions.length === 0) {
                createNewSession();
            } else {
                if (state.currentSessionId === sessionId) {
                    switchSession(state.sessions[0].id);
                } else {
                    renderSessionsList();
                    saveStateToLocalStorage();
                }
            }
        }

        function getCurrentSession() {
            return state.sessions.find(s => s.id === state.currentSessionId);
        }

        // Render Conversation Messages
        function renderMessages() {
            const currentSession = getCurrentSession();
            if (!currentSession) return;

            messagesList.innerHTML = '';
            currentSession.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.content, msg.imageUrl || null, msg.reasoning || null, false);
            });

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Render Individual Message
        function appendMessageToDOM(role, content, imageUrl = null, reasoning = null, isStreaming = false, customId = null) {
            const isUser = role === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-3 md:gap-4 ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in`;
            if (customId) msgDiv.id = customId;

            const avatar = isUser ? `
                <div class="w-7 h-7 rounded-full bg-brandGreen text-white flex items-center justify-center text-xs font-bold shrink-0">
                    <i class="fa-solid fa-user"></i>
                </div>
            ` : `
                <div class="w-7 h-7 rounded-full bg-zinc-800 border border-brandGreen/50 text-brandGreen flex items-center justify-center text-xs font-bold shrink-0">
                    s
                </div>
            `;

            // Display Attached Image if Present
            let imageHTML = '';
            if (imageUrl) {
                imageHTML = `<div class="mb-2"><img src="${imageUrl}" class="max-h-60 rounded-xl border border-zinc-700 object-contain"></div>`;
            }

            // Reasoning / Thinking Box
            let reasoningHTML = '';
            if (reasoning) {
                reasoningHTML = `
                    <details class="mb-3 border border-zinc-700/60 rounded-lg bg-zinc-900/50 text-xs">
                        <summary class="p-2 cursor-pointer text-zinc-400 hover:text-slate-200 font-mono flex items-center gap-1.5 select-none">
                            <i class="fa-solid fa-brain text-brandGreen"></i> Thinking Process...
                        </summary>
                        <div class="p-3 border-t border-zinc-800 text-zinc-400 font-mono text-[11px] leading-relaxed whitespace-pre-wrap">${escapeHtml(reasoning)}</div>
                    </details>
                `;
            }

            const bodyClass = isUser 
                ? 'bg-userBubble text-slate-100 rounded-2xl rounded-tr-none px-4 py-3' 
                : 'text-slate-200 w-full';

            msgDiv.innerHTML = `
                ${!isUser ? avatar : ''}
                <div class="max-w-[88%] md:max-w-[80%] space-y-1">
                    <div class="${bodyClass}">
                        ${imageHTML}
                        ${reasoningHTML}
                        <div class="msg-content markdown-body ${isStreaming ? 'typing-cursor' : ''}">${isUser ? escapeHtml(content) : marked.parse(content || '')}</div>
                    </div>
                    ${!isUser ? `
                        <div class="flex items-center gap-3 pt-1 text-[11px] text-zinc-500">
                            <button class="copy-btn hover:text-slate-300 transition"><i class="fa-regular fa-copy"></i> Copy</button>
                            <button class="speak-btn hover:text-slate-300 transition"><i class="fa-solid fa-volume-high"></i> Listen</button>
                        </div>
                    ` : ''}
                </div>
                ${isUser ? avatar : ''}
            `;

            // Action Handlers
            if (!isUser) {
                msgDiv.querySelector('.copy-btn').addEventListener('click', () => {
                    copyToClipboard(content);
                    showToast('Copied to clipboard!', 'success');
                });
                msgDiv.querySelector('.speak-btn').addEventListener('click', () => {
                    speakText(content);
                });
            }

            messagesList.appendChild(msgDiv);

            // Render LaTeX Equations with KaTeX
            if (!isUser && window.renderMathInElement) {
                renderMathInElement(msgDiv.querySelector('.msg-content'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        // Submit User Question & Attached Homework Image
        async function handleMessageSubmit(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            const image = state.attachedBase64Image;

            if ((!text && !image) || state.isGenerating) return;

            const session = getCurrentSession();
            if (!session) return;

            // Set Chat Title from prompt
            if (session.messages.length <= 1 && text) {
                session.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
                renderSessionsList();
            }

            // Append User Message
            const userMsgObj = { role: 'user', content: text || 'Please solve this homework/algebra problem.' };
            if (image) userMsgObj.imageUrl = image;

            session.messages.push(userMsgObj);
            appendMessageToDOM('user', userMsgObj.content, image);

            // Clear Input
            userInput.value = '';
            userInput.style.height = 'auto';
            clearAttachedImage();

            setGeneratingState(true);

            // AI Response Placeholder
            const tempMsgId = 'ai-msg-' + Date.now();
            appendMessageToDOM('assistant', '', null, null, true, tempMsgId);

            await generateResponse(session, tempMsgId);
        }

        // Call Pollinations AI API with Multimodal Vision Payload
        async function generateResponse(session, elementId) {
            state.abortController = new AbortController();

            // Construct API Payload with History & Vision Image URLs
            const payloadMessages = [
                { role: 'system', content: SYSTEM_PROMPT },
                ...session.messages.map(m => {
                    if (m.imageUrl) {
                        return {
                            role: m.role,
                            content: [
                                { type: 'text', text: m.content || 'Solve or read this image:' },
                                { type: 'image_url', image_url: { url: m.imageUrl } }
                            ]
                        };
                    }
                    return { role: m.role, content: m.content };
                })
            ];

            const msgDiv = document.getElementById(elementId);
            const contentContainer = msgDiv.querySelector('.msg-content');

            let accumulatedText = '';
            let accumulatedReasoning = '';

            try {
                const response = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: payloadMessages,
                        model: state.selectedModel,
                        temperature: 0.5,
                        stream: true
                    }),
                    signal: state.abortController.signal
                });

                if (!response.ok) throw new Error(`API error HTTP ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (let line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || trimmed.startsWith(':')) continue;

                        if (trimmed.startsWith('data: ')) {
                            const dataStr = trimmed.slice(6).trim();
                            if (dataStr === '[DONE]') break;

                            try {
                                const parsed = JSON.parse(dataStr);
                                const delta = parsed.choices?.[0]?.delta;

                                if (delta) {
                                    if (delta.reasoning || delta.thought) {
                                        accumulatedReasoning += (delta.reasoning || delta.thought);
                                    }
                                    if (delta.content) {
                                        accumulatedText += delta.content;
                                    }
                                }
                            } catch {
                                accumulatedText += dataStr;
                            }
                        } else {
                            accumulatedText += trimmed + '\n';
                        }

                        // Update reasoning UI if model is thinking
                        if (accumulatedReasoning && !msgDiv.querySelector('details')) {
                            const details = document.createElement('details');
                            details.className = 'mb-3 border border-zinc-700/60 rounded-lg bg-zinc-900/50 text-xs';
                            details.innerHTML = `
                                <summary class="p-2 cursor-pointer text-zinc-400 hover:text-slate-200 font-mono flex items-center gap-1.5 select-none">
                                    <i class="fa-solid fa-brain text-brandGreen animate-pulse"></i> Thinking Process...
                                </summary>
                                <div class="reasoning-body p-3 border-t border-zinc-800 text-zinc-400 font-mono text-[11px] leading-relaxed whitespace-pre-wrap"></div>
                            `;
                            contentContainer.parentNode.insertBefore(details, contentContainer);
                        }

                        if (accumulatedReasoning && msgDiv.querySelector('.reasoning-body')) {
                            msgDiv.querySelector('.reasoning-body').textContent = accumulatedReasoning;
                        }

                        // Stream Markdown Render
                        contentContainer.innerHTML = marked.parse(accumulatedText);
                        
                        // Render math in real-time if KaTeX available
                        if (window.renderMathInElement) {
                            renderMathInElement(contentContainer, {
                                delimiters: [
                                    {left: '$$', right: '$$', display: true},
                                    {left: '$', right: '$', display: false},
                                    {left: '\\(', right: '\\)', display: false},
                                    {left: '\\[', right: '\\]', display: true}
                                ],
                                throwOnError: false
                            });
                        }

                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }

                // Append finalized message to history
                const finalMsgObj = { 
                    role: 'assistant', 
                    content: accumulatedText,
                    reasoning: accumulatedReasoning || null 
                };
                session.messages.push(finalMsgObj);
                saveStateToLocalStorage();

                // Speak response if voice active
                if (state.autoSpeak && accumulatedText) {
                    speakText(accumulatedText);
                }

            } catch (err) {
                if (err.name === 'AbortError') {
                    showToast('Response stopped.', 'info');
                    if (accumulatedText) {
                        session.messages.push({ role: 'assistant', content: accumulatedText, reasoning: accumulatedReasoning });
                        saveStateToLocalStorage();
                    }
                } else {
                    console.error(err);
                    showToast('Failed to connect to slxa server.', 'error');
                    contentContainer.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-triangle-exclamation me-1"></i> Connection error. Please try again or re-upload the image.</span>`;
                }
            } finally {
                contentContainer.classList.remove('typing-cursor');
                contentContainer.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
                setGeneratingState(false);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // Stop Generation
        function stopGeneration() {
            if (state.abortController) {
                state.abortController.abort();
            }
        }

        // Toggle Generating State
        function setGeneratingState(isGenerating) {
            state.isGenerating = isGenerating;
            sendBtn.disabled = isGenerating;
            sendBtn.classList.toggle('hidden', isGenerating);
            stopBtn.classList.toggle('hidden', !isGenerating);
        }

        // Helper: Toast Notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bg = type === 'error' ? 'bg-red-900/90 border-red-500' : 
                       type === 'success' ? 'bg-emerald-900/90 border-emerald-500' : 'bg-zinc-800 border-zinc-700';
            
            toast.className = `${bg} border text-white text-xs px-3.5 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 transition duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-xmark text-red-400' : type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-brandGreen'}"></i><span>${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Helper: Copy Text
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
            } else {
                const area = document.createElement("textarea");
                area.value = text;
                area.style.position = "fixed";
                area.style.left = "-999999px";
                document.body.appendChild(area);
                area.focus();
                area.select();
                document.execCommand('copy');
                area.remove();
            }
        }

        // Helper: Escape HTML
        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
