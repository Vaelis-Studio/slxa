<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slxa — AI Assistant</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Markdown & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

  <!-- KaTeX Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-main: #090a0f;
      --bg-sidebar: #11131b;
      --bg-card: #181b26;
      --bg-input: #1f2333;
      --accent-primary: #10b981;
      --accent-hover: #059669;
      --accent-light: rgba(16, 185, 129, 0.12);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2e344a;
      --user-msg-bg: #222738;
      --ai-msg-bg: #141722;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 50;
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.5px;
      color: var(--accent-primary);
    }

    .brand-badge {
      font-size: 0.65rem;
      background: var(--accent-light);
      border: 1px solid var(--accent-primary);
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .new-chat-btn {
      margin: 14px 16px;
      padding: 12px;
      background: var(--accent-primary);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: background 0.15s ease;
    }

    .history-item:hover, .history-item.active {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .history-item .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .history-item .delete-btn {
      opacity: 0;
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 4px;
      transition: opacity 0.2s ease;
    }

    .history-item:hover .delete-btn { opacity: 1; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .creator-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      font-weight: 600;
    }

    .social-links {
      display: flex;
      gap: 12px;
    }

    .social-links a {
      color: var(--accent-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    .top-bar {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(17, 19, 27, 0.8);
      backdrop-filter: blur(10px);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-sidebar-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }

    .model-selector {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tts-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tts-toggle-btn.active {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* Messages Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* Feature Banner */
    .welcome-banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(24, 27, 38, 0.8) 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .banner-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .banner-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner-card i {
      color: var(--accent-primary);
      font-size: 1.1rem;
    }

    /* Message Item */
    .message {
      display: flex;
      gap: 16px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: #3b82f6;
      color: #fff;
    }

    .message.assistant .avatar {
      background: var(--accent-primary);
      color: #000;
    }

    .message-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-x: auto;
    }

    .sender-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .message-content {
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .message-content p { margin-bottom: 0.8rem; }
    .message-content p:last-child { margin-bottom: 0; }

    /* Code Blocks */
    .message-content pre {
      background: #12141d;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin: 12px 0;
    }

    .message-content code {
      font-family: var(--font-mono);
      font-size: 0.88rem;
    }

    /* LaTeX / Math Display Fixes */
    .katex-display {
      margin: 12px 0 !important;
      padding: 12px !important;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border-left: 3px solid var(--accent-primary);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .katex {
      font-size: 1.1em !important;
      color: #f3f4f6 !important;
    }

    .katex .boxed {
      border: 2px solid var(--accent-primary) !important;
      padding: 4px 8px !important;
      border-radius: 6px !important;
      background: rgba(16, 185, 129, 0.08) !important;
      display: inline-block;
      margin: 2px 0;
    }

    /* Images in Messages */
    .message-image {
      max-width: 300px;
      max-height: 300px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-top: 8px;
      cursor: pointer;
    }

    .generated-ai-image {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin: 10px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    /* Reasoning Container */
    .reasoning-box {
      background: #111420;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .reasoning-header {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      user-select: none;
    }

    .reasoning-content {
      margin-top: 8px;
      white-space: pre-wrap;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    /* Action Buttons under Message */
    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .msg-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .msg-action-btn:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }

    /* Input Dock */
    .input-dock-container {
      padding: 16px 24px 24px 24px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }

    .input-box {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .input-box:focus-within {
      border-color: var(--accent-primary);
    }

    .image-preview-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .preview-thumb-container {
      position: relative;
      display: inline-block;
    }

    .preview-thumb {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .remove-thumb-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      max-height: 200px;
      min-height: 24px;
      line-height: 1.5;
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .send-btn {
      background: var(--accent-primary);
      color: #000;
      border: none;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .image-gen-shortcut {
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Modal / Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .toggle-sidebar-btn {
        display: block;
      }
    }

    :root {
      --bg-main: #ffffff;
      --bg-sidebar: #f7f7f8;
      --bg-card: #f1f1f1;
      --bg-input: #ffffff;
      --accent-primary: #10a37f;
      --accent-hover: #0e8f70;
      --accent-light: rgba(16, 163, 127, .12);
      --text-main: #202123;
      --text-muted: #6e6e80;
      --border-color: #e5e5e5;
      --user-msg-bg: #f1f1f1;
      --ai-msg-bg: #ffffff;
    }

    body { background: var(--bg-main); color: var(--text-main); }
    .sidebar { background: var(--bg-sidebar); border-color: var(--border-color); }
    .sidebar-header { border: 0; padding: 18px 16px 8px; }
    .brand { color: var(--text-main); font-size: 1.16rem; letter-spacing: 0; }
    .brand > i { color: var(--accent-primary); }
    .brand-badge { color: var(--text-muted); background: transparent; border: 0; font-size: .6rem; }
    .new-chat-btn { margin: 10px 12px; padding: 11px 13px; border-radius: 9px; color: #fff; }
    .chat-history { padding: 4px 10px; }
    .history-item { min-height: 40px; color: #41434a; }
    .history-item:hover, .history-item.active { background: #ececf0; color: var(--text-main); }
    .sidebar-footer { border-color: var(--border-color); }
    .social-links a { color: var(--text-muted); }
    .top-bar { height: 60px; padding: 0 24px; background: rgba(255,255,255,.94); border-color: var(--border-color); }
    .model-selector, .tts-toggle-btn, .theme-toggle-btn, .demo-toggle-btn {
      background: transparent; border: 1px solid transparent; color: var(--text-main);
      padding: 8px 10px; border-radius: 8px;
    }
    .model-selector { font-weight: 600; font-size: .9rem; }
    .model-selector:hover, .tts-toggle-btn:hover, .theme-toggle-btn:hover, .demo-toggle-btn:hover { background: var(--bg-card); }
    .top-chat-title { color: var(--text-muted); font-size: .84rem; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-bar-actions { gap: 3px; }
    .theme-toggle-btn, .demo-toggle-btn { cursor: pointer; height: 38px; }
    .demo-toggle-btn { display: flex; align-items: center; gap: 7px; font-size: .78rem; }
    .demo-toggle-btn.active { color: #9a6500; background: #fff6db; border-color: #f0dfa9; }
    .chat-container { padding: 28px 24px 18px; gap: 24px; }
    .welcome-banner {
      width: min(100%, 820px); margin: auto auto 10px; padding: 18px 8px 8px;
      border: 0; background: transparent; border-radius: 0; gap: 12px;
      animation: welcome-in .5s both;
    }
    .banner-title { color: var(--text-main); font-size: clamp(1.7rem, 3vw, 2.15rem); letter-spacing: 0; }
    .banner-title i { color: var(--accent-primary); font-size: 1.25rem; }
    .welcome-subtitle { color: var(--text-muted); font-size: .94rem; }
    .banner-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
    .banner-card {
      min-height: 72px; padding: 14px; border-color: var(--border-color); border-radius: 10px;
      background: #fff; color: #34363b; line-height: 1.4; cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s, box-shadow .18s;
      font: inherit; text-align: left;
    }
    .banner-card:hover { border-color: #b9c9c4; background: #fbfdfc; transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.05); }
    .banner-card:active { transform: translateY(0) scale(.99); }
    .banner-card:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }
    .banner-card i { color: var(--accent-primary); }
    .message { max-width: 820px; gap: 14px; animation: message-in .22s ease both; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; font-size: .78rem; }
    .message.user .avatar { background: #e9edf3; color: #45566d; }
    .message.assistant .avatar { background: #e4f3ed; color: var(--accent-primary); }
    .sender-name { color: var(--text-main); font-size: .84rem; }
    .message-content { font-size: .96rem; line-height: 1.75; }
    .message-content pre { background: #f6f6f6; border-color: var(--border-color); }
    .message-content pre code { color: #252a31; }
    .katex { color: var(--text-main) !important; }
    .reasoning-box { background: #f6f7f8; border: 1px solid var(--border-color); color: var(--text-muted); }
    .input-dock-container { max-width: 900px; padding: 10px 24px 12px; }
    .input-box {
      border-color: #d9d9e3; border-radius: 18px; padding: 13px 14px 12px 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07); transition: border-color .18s, box-shadow .18s, transform .18s;
    }
    .input-box:focus-within { border-color: #a7bdb5; box-shadow: 0 5px 22px rgba(16,163,127,.1); transform: translateY(-1px); }
    textarea { font-size: .96rem; }
    .icon-btn:hover { background: #eeeeef; }
    .send-btn { color: #fff; border-radius: 50%; width: 38px; height: 38px; transition: transform .16s, background .16s; }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:not(:disabled) { animation: send-ready .24s ease both; }
    .image-gen-shortcut { background: #f3f8f5; border-color: #d9e9e0; color: var(--accent-primary); }
    .composer-note { text-align: center; color: #85858f; font-size: .72rem; padding-top: 9px; }
    .history-search-wrap { padding: 0 14px 8px; }
    .history-search {
      width: 100%; height: 36px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; padding: 0 10px; color: var(--text-main); font: inherit; font-size: .82rem; outline: 0;
    }
    .history-search:focus { border-color: var(--border-color); background: #fff; }
    .history-search::placeholder { color: #85858f; }
    .empty-search { padding: 12px; color: var(--text-muted); font-size: .82rem; text-align: center; }
    .typing-indicator { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; }
    .typing-indicator span { width: 6px; height: 6px; border-radius: 50%; background: #92949b; animation: typing-bounce .9s infinite ease-in-out; }
    .typing-indicator span:nth-child(2) { animation-delay: .12s; }
    .typing-indicator span:nth-child(3) { animation-delay: .24s; }
    body.dark-theme {
      --bg-main: #212121; --bg-sidebar: #171717; --bg-card: #2f2f2f; --bg-input: #303030;
      --accent-primary: #19c37d; --accent-hover: #14a66a; --accent-light: rgba(25,195,125,.12);
      --text-main: #ececec; --text-muted: #a0a0a0; --border-color: #3a3a3a;
      --user-msg-bg: #303030; --ai-msg-bg: #212121;
    }
    body.dark-theme .top-bar { background: rgba(33,33,33,.94); }
    body.dark-theme .banner-card { background: #262626; color: var(--text-main); }
    body.dark-theme .banner-card:hover, body.dark-theme .history-item:hover, body.dark-theme .history-item.active { background: #303030; }
    body.dark-theme .history-search:focus { background: #262626; }
    body.dark-theme .message-content pre { background: #262626; }
    body.dark-theme .message-content pre code { color: #ececec; }
    body.dark-theme .reasoning-box { background: #262626; }
    body.dark-theme .message.user .avatar { background: #39404a; color: #f0f2f5; }
    body.dark-theme .message.assistant .avatar { background: #244235; color: #8de0b5; }
    body.dark-theme .input-box { box-shadow: 0 4px 18px rgba(0,0,0,.2); }
    body.dark-theme .image-gen-shortcut { background: #293a32; border-color: #3b5548; }
    body.dark-theme .demo-toggle-btn.active { color: #f5d27a; background: #3d3522; border-color: #66572e; }
    @keyframes welcome-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes message-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
    @keyframes send-ready { from { transform: scale(.9); } to { transform: scale(1); } }
    @media (max-width: 768px) {
      .top-bar { padding: 0 12px; }
      .top-chat-title { display: none; }
      .chat-container { padding: 20px 16px 12px; gap: 20px; }
      .welcome-banner { padding: 24px 0 8px; }
      .banner-grid { grid-template-columns: 1fr; }
      .banner-card { min-height: 60px; }
      .input-dock-container { padding: 8px 12px 10px; }
      .input-actions { gap: 3px; }
      .image-gen-shortcut { padding: 8px; font-size: 0; }
      .image-gen-shortcut i { font-size: .95rem; }
      .tts-toggle-btn { padding: 8px; font-size: 0; }
      .tts-toggle-btn i { font-size: .95rem; }
      .demo-toggle-btn { width: 38px; justify-content: center; font-size: 0; }
      .demo-toggle-btn i { font-size: .9rem; }
      .message { gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->

    </div>

    <button class="new-chat-btn" id="new-chat-btn">

    </button>

    <div class="history-search-wrap">
      <input class="history-search" id="history-search" type="search" placeholder="Search conversations" aria-label="Search conversations">
    </div>

    <div class="chat-history" id="chat-history"></div>

    <div class="sidebar-footer">
      <div class="creator-tag">
        <i class="fa-solid fa-code"></i> Created by Eyob
      </div>
      <div class="social-links">
        <a href="https://www.tiktok.com/@slxa19" target="_blank"><i class="fa-brands fa-tiktok"></i> @slxa19</a>
        <a href="https://www.instagram.com/slxa19" target="_blank"><i class="fa-brands fa-instagram"></i> @slxa19</a>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="toggle-sidebar-btn" id="toggle-sidebar-btn"><i class="fa-solid fa-bars"></i></button>
        <span class="top-chat-title" id="top-chat-title">New chat</span>
        <select class="model-selector" id="model-select">
          <option value="openai">GPT-4o</option>
          <option value="gemini">Gemini 2.5 Flash</option>
          <option value="deepseek">DeepSeek R1 (Reasoning)</option>
          <option value="qwen">Qwen 2.5 Coder</option>
          <option value="mistral">Mistral Small</option>
          <option value="llama">Llama 3.3 70B</option>
        </select>
      </div>

      <div class="top-bar-actions">
        <button class="demo-toggle-btn" id="demo-toggle-btn" type="button" aria-pressed="false" title="Use a simulated local reply">

        <button class="theme-toggle-btn" id="theme-toggle-btn" title="Switch theme" aria-label="Switch theme"><i class="fa-solid fa-moon"></i></button>

          <i class="fa-solid fa-volume-high"></i> Voice: <span id="tts-status">OFF</span>

    <div class="chat-container" id="chat-container"></div>

    <!-- Input Dock -->
    <div class="input-dock-container">

        <div class="input-row">
          <textarea id="user-input" rows="1" placeholder="Message slxa..."></textarea>
          <div class="input-actions">

            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <button class="icon-btn" id="attach-btn" title="Upload Math Photo or Image">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <button class="send-btn" id="send-btn">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="composer-note">slxa can make mistakes. Check important information.</div>
    </div>
  </main>

  <!-- Image Lightbox -->
  <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Enlarged view">
  </div>

  <script>
    // --- APP STATE & CONFIG ---
    const SYSTEM_PROMPT = `You are slxa, an intelligent AI homework assistant created strictly by a single individual named Eyob. 
- Creator Identity: You were created solely by Eyob (one single person, NOT a team or group).
- Introduction Rule: Greet naturally and briefly. Explain that you can help with homework, math, writing, research, and brainstorming when relevant. Mention social handles only if the user asks.
- Social Handles: TikTok & Instagram @slxa19.
- Math & Algebra Formatting Rules: Always format math formulas using proper standard LaTeX. 
  For inline math use single dollar signs: $x^2 + y^2 = r^2$ or $\\frac{a}{b}$. 
  For display/block math use double dollar signs:
  $$\\frac{x+1}{2} = 5$$
  Highlight final numerical answers inside \\boxed{...}. Always output stacked fractions like \\frac{a}{b} and never leave raw plain slash text for equations if stacked fractions make it clearer.
- Text to Image Capability: You can generate images! Tell users to ask you "draw..." or "generate an image of..." or start with "/image".`;

    let state = {
      chats: JSON.parse(localStorage.getItem('slxa_chats') || '[]'),
      currentChatId: localStorage.getItem('slxa_current_id') || null,
      ttsEnabled: localStorage.getItem('slxa_tts') === 'true',
      darkTheme: localStorage.getItem('slxa_theme') === 'dark',
      demoMode: localStorage.getItem('slxa_demo') === 'true',
      historyQuery: '',
      abortController: null,
      attachedImageBase64: null,
      isStreaming: false
    };

    // --- DOM ELEMENTS ---
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    const attachBtn = document.getElementById('attach-btn');
    const previewBar = document.getElementById('image-preview-bar');
    const modelSelect = document.getElementById('model-select');
    const ttsToggleBtn = document.getElementById('tts-toggle-btn');
    const ttsStatus = document.getElementById('tts-status');
    const chatHistory = document.getElementById('chat-history');
    const newChatBtn = document.getElementById('new-chat-btn');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const imageModeBtn = document.getElementById('image-mode-btn');
    const historySearch = document.getElementById('history-search');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const demoToggleBtn = document.getElementById('demo-toggle-btn');
    const topChatTitle = document.getElementById('top-chat-title');

    // --- INITIALIZATION ---
    function init() {
      if (!state.chats.length) {
        createNewChat();
      } else if (!state.currentChatId || !state.chats.find(c => c.id === state.currentChatId)) {
        state.currentChatId = state.chats[0].id;
      }

      updateTTSUI();
      updateThemeUI();
      updateDemoModeUI();
      modelSelect.value = localStorage.getItem('slxa_model') || modelSelect.value;
      renderSidebarHistory();
      renderCurrentChat();
      setupEventListeners();
    }

    // --- EVENT LISTENERS ---
    function setupEventListeners() {
      userInput.addEventListener('input', () => {
        autoResizeTextarea();
        updateSendButton();
      });
      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      sendBtn.addEventListener('click', () => {
        if (state.isStreaming) state.abortController?.abort();
        else handleSend();
      });
      newChatBtn.addEventListener('click', () => createNewChat());
      historySearch.addEventListener('input', () => {
        state.historyQuery = historySearch.value.trim().toLowerCase();
        renderSidebarHistory();
      });
      modelSelect.addEventListener('change', () => localStorage.setItem('slxa_model', modelSelect.value));
      themeToggleBtn.addEventListener('click', () => {
        state.darkTheme = !state.darkTheme;
        localStorage.setItem('slxa_theme', state.darkTheme ? 'dark' : 'light');
        updateThemeUI();
      });
      demoToggleBtn.addEventListener('click', () => {
        state.demoMode = !state.demoMode;
        localStorage.setItem('slxa_demo', state.demoMode);
        updateDemoModeUI();
      });
      chatContainer.addEventListener('click', (event) => {
        const promptCard = event.target.closest('[data-prompt]');
        if (!promptCard) return;
        userInput.value = promptCard.dataset.prompt;
        autoResizeTextarea();
        updateSendButton();
        userInput.focus();
      });
      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          historySearch.focus();
        }
        if (event.key === 'Escape') sidebar.classList.remove('open');
      });

      attachBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFileSelect);

      ttsToggleBtn.addEventListener('click', () => {
        state.ttsEnabled = !state.ttsEnabled;
        localStorage.setItem('slxa_tts', state.ttsEnabled);
        updateTTSUI();
      });

      sendBtn.setAttribute('aria-label', 'Send message');
      sendBtn.title = 'Send message';
      updateSendButton();

      toggleSidebarBtn.addEventListener('click', () => sidebar.classList.add('open'));
      closeSidebarBtn.addEventListener('click', () => sidebar.classList.remove('open'));

      imageModeBtn.addEventListener('click', () => {
        if (!userInput.value.startsWith('/image ')) {
          userInput.value = '/image ' + userInput.value;
        }
        userInput.focus();
      });
    }

    function autoResizeTextarea() {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
    }

    function updateTTSUI() {
      if (state.ttsEnabled) {
        ttsToggleBtn.classList.add('active');
        ttsStatus.textContent = 'ON';
      } else {
        ttsToggleBtn.classList.remove('active');
        ttsStatus.textContent = 'OFF';
        window.speechSynthesis.cancel();
      }
    }

    function updateThemeUI() {
      document.body.classList.toggle('dark-theme', state.darkTheme);
      themeToggleBtn.innerHTML = state.darkTheme
        ? '<i class="fa-solid fa-sun"></i>'
        : '<i class="fa-solid fa-moon"></i>';
      themeToggleBtn.title = state.darkTheme ? 'Switch to light theme' : 'Switch to dark theme';
      themeToggleBtn.setAttribute('aria-label', themeToggleBtn.title);
    }

    function updateDemoModeUI() {
      demoToggleBtn.classList.toggle('active', state.demoMode);
      demoToggleBtn.setAttribute('aria-pressed', String(state.demoMode));
      demoToggleBtn.title = state.demoMode
        ? 'Demo mode is on: replies are simulated locally'
        : 'Use a simulated local reply';
    }

    function updateSendButton() {
      sendBtn.innerHTML = state.isStreaming
        ? '<i class="fa-solid fa-stop"></i>'
        : '<i class="fa-solid fa-arrow-up"></i>';
      sendBtn.title = state.isStreaming ? 'Stop generating' : 'Send message';
      sendBtn.setAttribute('aria-label', sendBtn.title);
      sendBtn.disabled = !state.isStreaming && !userInput.value.trim() && !state.attachedImageBase64;
    }

    // --- CHAT MANAGEMENT ---
    function createNewChat() {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Homework Chat',
        messages: [
          {
            role: 'assistant',
            content: "Hi, I'm slxa. What would you like help with today?"
          }
        ]
      };
      state.chats.unshift(newChat);
      state.currentChatId = newChat.id;
      saveState();
      renderSidebarHistory();
      renderCurrentChat();
    }

    function getCurrentChat() {
      return state.chats.find(c => c.id === state.currentChatId);
    }

    function saveState() {
      localStorage.setItem('slxa_chats', JSON.stringify(state.chats));
      localStorage.setItem('slxa_current_id', state.currentChatId);
    }

    function renderSidebarHistory() {
      chatHistory.innerHTML = '';
      const visibleChats = state.chats.filter(chat => chat.title.toLowerCase().includes(state.historyQuery));
      if (!visibleChats.length) {
        chatHistory.innerHTML = '<div class="empty-search">No matching conversations</div>';
        return;
      }
      visibleChats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `history-item ${chat.id === state.currentChatId ? 'active' : ''}`;
        item.innerHTML = `
          <span class="title"><i class="fa-regular fa-message"></i> ${escapeHtml(chat.title)}</span>
          <button class="delete-btn" title="Delete Chat"><i class="fa-solid fa-trash"></i></button>
        `;
        item.addEventListener('click', (e) => {
          if (e.target.closest('.delete-btn')) {
            e.stopPropagation();
            deleteChat(chat.id);
          } else {
            state.currentChatId = chat.id;
            saveState();
            renderSidebarHistory();
            renderCurrentChat();
            sidebar.classList.remove('open');
          }
        });
        chatHistory.appendChild(item);
      });
    }

    function deleteChat(id) {
      state.chats = state.chats.filter(c => c.id !== id);
      if (state.chats.length === 0) {
        createNewChat();
      } else {
        if (state.currentChatId === id) {
          state.currentChatId = state.chats[0].id;
        }
        saveState();
        renderSidebarHistory();
        renderCurrentChat();
      }
    }

    // --- FILE HANDLING ---
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        state.attachedImageBase64 = event.target.result;
        renderImagePreview();
        updateSendButton();
      };
      reader.readAsDataURL(file);
    }

    function renderImagePreview() {
      if (!state.attachedImageBase64) {
        previewBar.style.display = 'none';
        previewBar.innerHTML = '';
        return;
      }
      previewBar.style.display = 'flex';
      previewBar.innerHTML = `
        <div class="preview-thumb-container">
          <img src="${state.attachedImageBase64}" class="preview-thumb">
          <button class="remove-thumb-btn" onclick="clearAttachedImage()"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `;
    }

    function clearAttachedImage() {
      state.attachedImageBase64 = null;
      fileInput.value = '';
      renderImagePreview();
      updateSendButton();
    }

    // --- MATH SANITIZER & REAL-TIME PRE-PROCESSOR ---
    function preprocessMathAndMarkdown(text) {
      if (!text) return '';

      let processed = text;

      // Convert bracket math delimiters \[ ... \] and \( ... \) into KaTeX standard $$ and $
      processed = processed.replace(/\\\[([\s\S]*?)\\\]/g, '$$$$ $1 $$$$');
      processed = processed.replace(/\\\(([\s\S]*?)\\\)/g, '$$ $1 $$');

      // Auto-wrap raw LaTeX equations containing \frac, \sqrt, \boxed, \quad if not already inside $ or $$
      processed = processed.replace(/(?<!\$)(?<!\S)(\\boxed\{[^}]+\}|\\frac\{[^}]+\}\{[^}]+\}|\\sqrt\{[^}]+\})(?!\$)/g, '$$ $1 $$');

      // Slash-based fraction auto-converter for expressions like (x+1)/2 or 3/4 outside math tags
      processed = processed.replace(/(?<![\$\w\\])\(([^()]+)\)\/([0-9a-zA-Z]+)(?![\$\w])/g, '$$ \\frac{$1}{$2} $$');

      return processed;
    }

    // --- MESSAGE RENDERING ---
    function renderCurrentChat() {
      chatContainer.innerHTML = '';
      const chat = getCurrentChat();
      if (!chat) return;
      topChatTitle.textContent = chat.title;

      // Render Feature Banner if it's a short/new chat
      if (chat.messages.length <= 2) {
        const banner = document.createElement('div');
        banner.className = 'welcome-banner';
        banner.innerHTML = `
          <div class="banner-title"><i class="fa-solid fa-sparkles"></i> What can I help with?</div>
          <div class="welcome-subtitle">Ask a question, work through a problem, or start with an idea.</div>
          <div class="banner-grid">
            <button class="banner-card" type="button" data-prompt="Explain the Pythagorean theorem with a simple example."><i class="fa-solid fa-calculator"></i> Explain a tricky problem</button>
            <button class="banner-card" type="button" data-prompt="Make me a one-week study plan for an upcoming exam."><i class="fa-regular fa-calendar"></i> Build a study plan</button>
            <button class="banner-card" type="button" data-prompt="Summarize photosynthesis in five clear bullet points."><i class="fa-solid fa-align-left"></i> Summarize a topic</button>
            <button class="banner-card" type="button" data-prompt="/image a cozy study desk with books and soft morning light"><i class="fa-solid fa-wand-magic-sparkles"></i> Create an image</button>
          </div>
        `;
        chatContainer.appendChild(banner);
      }

      chat.messages.forEach((msg, idx) => {
        appendMessageUI(msg.role, msg.content, msg.image, msg.reasoning, idx);
      });

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendMessageUI(role, content, image = null, reasoning = null, index = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

      const body = document.createElement('div');
      body.className = 'message-body';

      const sender = document.createElement('div');
      sender.className = 'sender-name';
      sender.textContent = role === 'user' ? 'You' : 'slxa AI';

      body.appendChild(sender);

      // Reasoning box for thinking models
      if (reasoning) {
        const reasonBox = document.createElement('div');
        reasonBox.className = 'reasoning-box';
        reasonBox.innerHTML = `
          <div class="reasoning-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            <i class="fa-solid fa-brain"></i> Thinking Process...
          </div>
          <div class="reasoning-content" style="display: none;">${escapeHtml(reasoning)}</div>
        `;
        body.appendChild(reasonBox);
      }

      // Main Content Block
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      // Parse text/markdown & math
      const formattedText = preprocessMathAndMarkdown(content);
      contentDiv.innerHTML = marked.parse(formattedText);

      body.appendChild(contentDiv);

      // Attached Image or Image Generation Display
      if (image) {
        const imgEl = document.createElement('img');
        imgEl.className = 'message-image';
        imgEl.src = image;
        imgEl.onclick = () => openLightbox(image);
        body.appendChild(imgEl);
      }

      // Actions under Assistant Messages
      if (role === 'assistant') {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        
        const speakBtn = document.createElement('button');
        speakBtn.className = 'msg-action-btn';
        speakBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Listen';
        speakBtn.onclick = () => speakText(content);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'msg-action-btn';
        copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(content);
          copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
          setTimeout(() => copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy', 2000);
        };

        actions.appendChild(speakBtn);
        actions.appendChild(copyBtn);
        body.appendChild(actions);
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(body);
      chatContainer.appendChild(msgDiv);

      // Render KaTeX Math
      renderMathInElement(contentDiv, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });

      // Highlight Code
      contentDiv.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      return { msgDiv, contentDiv, body };
    }

    // --- SEND & STREAMING LOGIC ---
    async function handleSend() {
      const text = userInput.value.trim();
      const attachedImg = state.attachedImageBase64;

      if (!text && !attachedImg) return;
      if (state.isStreaming) return;

      const chat = getCurrentChat();

      // Check if user is requesting Image Generation directly
      if (text.toLowerCase().startsWith('/image ') || text.toLowerCase().startsWith('generate an image') || text.toLowerCase().startsWith('draw ')) {
        await handleImageGeneration(text);
        return;
      }

      // Update Chat Title on first query
      if (chat.messages.length <= 1) {
        chat.title = text.slice(0, 30) || 'Image Problem';
        renderSidebarHistory();
      }

      // Push User Message
      const userMsg = { role: 'user', content: text, image: attachedImg };
      chat.messages.push(userMsg);

      // Reset Inputs
      userInput.value = '';
      autoResizeTextarea();
      clearAttachedImage();

      renderCurrentChat();
      state.isStreaming = true;
      state.abortController = new AbortController();
      updateSendButton();

      // Prepare AI Message UI placeholder
      const { msgDiv, contentDiv, body } = appendMessageUI('assistant', '');
      contentDiv.innerHTML = '<div class="typing-indicator" aria-label="Assistant is thinking"><span></span><span></span><span></span></div>';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      if (state.demoMode) {
        await runDemoResponse(chat, contentDiv, state.abortController.signal);
        return;
      }

      let fullResponse = '';
      let reasoningContent = '';
      let reasoningBoxEl = null;

      try {
        const payloadMessages = [
          { role: 'system', content: SYSTEM_PROMPT }
        ];

        // Attach previous chat context
        chat.messages.forEach(m => {
          if (m.image) {
            payloadMessages.push({
              role: m.role,
              content: [
                { type: 'text', text: m.content || 'Analyze this image:' },
                { type: 'image_url', image_url: { url: m.image } }
              ]
            });
          } else {
            payloadMessages.push({ role: m.role, content: m.content });
          }
        });

        const selectedModel = modelSelect.value;
        const response = await fetch('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: state.abortController.signal,
          body: JSON.stringify({
            messages: payloadMessages,
            model: selectedModel,
            stream: true
          })
        });
        if (!response.ok) throw new Error(`AI request failed with status ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith(':')) continue;
            if (trimmed === 'data: [DONE]') break;

            if (trimmed.startsWith('data: ')) {
              try {
                const json = JSON.parse(trimmed.slice(6));
                const delta = json.choices[0]?.delta || {};

                // Intercept reasoning / thinking deltas
                if (delta.reasoning || delta.thought) {
                  reasoningContent += (delta.reasoning || delta.thought);
                  if (!reasoningBoxEl) {
                    reasoningBoxEl = document.createElement('div');
                    reasoningBoxEl.className = 'reasoning-box';
                    reasoningBoxEl.innerHTML = `
                      <div class="reasoning-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
                        <i class="fa-solid fa-brain"></i> Thinking Process...
                      </div>
                      <div class="reasoning-content">${escapeHtml(reasoningContent)}</div>
                    `;
                    body.insertBefore(reasoningBoxEl, contentDiv);
                  } else {
                    reasoningBoxEl.querySelector('.reasoning-content').textContent = reasoningContent;
                  }
                }

                // Append regular response deltas
                if (delta.content) {
                  fullResponse += delta.content;
                  const formatted = preprocessMathAndMarkdown(fullResponse);
                  contentDiv.innerHTML = marked.parse(formatted);

                  renderMathInElement(contentDiv, {
                    delimiters: [
                      {left: '$$', right: '$$', display: true},
                      {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                  });
                }
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } catch (err) {
                // Ignore chunk parse errors
              }
            }
          }
        }

        // Finalize Assistant Message
        const assistantMsg = {
          role: 'assistant',
          content: fullResponse,
          reasoning: reasoningContent || null
        };
        chat.messages.push(assistantMsg);
        saveState();

        if (state.ttsEnabled) {
          speakText(fullResponse);
        }

      } catch (error) {
        if (error.name === 'AbortError') {
          if (fullResponse) chat.messages.push({ role: 'assistant', content: fullResponse, reasoning: reasoningContent || null });
        } else {
          chat.messages.push({ role: 'assistant', content: fullResponse || "I couldn't connect to the assistant. Please try again." });
        }
        saveState();
      } finally {
        state.isStreaming = false;
        state.abortController = null;
        updateSendButton();
        renderCurrentChat();
      }
    }

    async function runDemoResponse(chat, contentDiv, signal) {
      const response = "This is a simulated reply running entirely in your browser. Turn Demo off to send messages to the selected live model.";
      const words = response.match(/\S+\s*/g) || [];
      let visibleResponse = '';

      try {
        for (const word of words) {
          if (signal.aborted) break;
          visibleResponse += word;
          contentDiv.textContent = visibleResponse;
          chatContainer.scrollTop = chatContainer.scrollHeight;
          await new Promise(resolve => setTimeout(resolve, 45));
        }
        if (visibleResponse) {
          chat.messages.push({ role: 'assistant', content: visibleResponse.trim() });
          saveState();
          if (state.ttsEnabled) speakText(visibleResponse);
        }
      } finally {
        state.isStreaming = false;
        state.abortController = null;
        updateSendButton();
        renderCurrentChat();
      }
    }

    // --- TEXT TO IMAGE GENERATION ---
    async function handleImageGeneration(promptText) {
      let cleanPrompt = promptText.replace(/^\/image\s*/i, '').replace(/^generate an image of\s*/i, '').replace(/^draw\s*/i, '');
      if (!cleanPrompt) cleanPrompt = 'colorful abstract homework math pattern';

      const chat = getCurrentChat();
      chat.messages.push({ role: 'user', content: promptText });

      userInput.value = '';
      renderCurrentChat();

      const encodedPrompt = encodeURIComponent(cleanPrompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;

      const assistantMsg = {
        role: 'assistant',
        content: `Here is the image generated for: **"${escapeHtml(cleanPrompt)}"**`,
        image: imageUrl
      };

      chat.messages.push(assistantMsg);
      saveState();
      renderCurrentChat();
    }

    // --- TEXT TO SPEECH ---
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      // Clean Markdown tags and Math equations before reading
      const cleanText = text
        .replace(/\$\$[\s\S]*?\$\$/g, ' mathematical equation ')
        .replace(/\$.*?\$/g, ' equation ')
        .replace(/[*_#`~]/g, '')
        .replace(/\[.*?\]\(.*?\)/g, '');

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
      if (preferredVoice) utterance.voice = preferredVoice;

      window.speechSynthesis.speak(utterance);
    }

    // --- UTILS ---
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      lbImg.src = src;
      lb.style.display = 'flex';
    }

    // Run Initialization
    init();
  </script>
