<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slxa — AI Assistant</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Markdown & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

  <!-- KaTeX Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-main: #090a0f;
      --bg-sidebar: #11131b;
      --bg-card: #181b26;
      --bg-input: #1f2333;
      --accent-primary: #10b981;
      --accent-hover: #059669;
      --accent-light: rgba(16, 185, 129, 0.12);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #2e344a;
      --user-msg-bg: #222738;
      --ai-msg-bg: #141722;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 50;
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.5px;
      color: var(--accent-primary);
    }

    .brand-badge {
      font-size: 0.65rem;
      background: var(--accent-light);
      border: 1px solid var(--accent-primary);
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .new-chat-btn {
      margin: 14px 16px;
      padding: 12px;
      background: var(--accent-primary);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .new-chat-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: background 0.15s ease;
    }

    .history-item:hover, .history-item.active {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .history-item .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .history-item .delete-btn {
      opacity: 0;
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 4px;
      transition: opacity 0.2s ease;
    }

    .history-item:hover .delete-btn { opacity: 1; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .creator-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      font-weight: 600;
    }

    .social-links {
      display: flex;
      gap: 12px;
    }

    .social-links a {
      color: var(--accent-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    .top-bar {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(17, 19, 27, 0.8);
      backdrop-filter: blur(10px);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-sidebar-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
    }

    .model-selector {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tts-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tts-toggle-btn.active {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* Messages Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* Feature Banner */
    .welcome-banner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(24, 27, 38, 0.8) 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .banner-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .banner-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner-card i {
      color: var(--accent-primary);
      font-size: 1.1rem;
    }

    /* Message Item */
    .message {
      display: flex;
      gap: 16px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: #3b82f6;
      color: #fff;
    }

    .message.assistant .avatar {
      background: var(--accent-primary);
      color: #000;
    }

    .message-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-x: auto;
    }

    .sender-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .message-content {
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .message-content p { margin-bottom: 0.8rem; }
    .message-content p:last-child { margin-bottom: 0; }

    /* Code Blocks */
    .message-content pre {
      background: #12141d;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin: 12px 0;
    }

    .message-content code {
      font-family: var(--font-mono);
      font-size: 0.88rem;
    }

    /* LaTeX / Math Display Fixes */
    .katex-display {
      margin: 12px 0 !important;
      padding: 12px !important;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border-left: 3px solid var(--accent-primary);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .katex {
      font-size: 1.1em !important;
      color: #f3f4f6 !important;
    }

    .katex .boxed {
      border: 2px solid var(--accent-primary) !important;
      padding: 4px 8px !important;
      border-radius: 6px !important;
      background: rgba(16, 185, 129, 0.08) !important;
      display: inline-block;
      margin: 2px 0;
    }

    /* Images in Messages */
    .message-image {
      max-width: 300px;
      max-height: 300px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-top: 8px;
      cursor: pointer;
    }

    .generated-ai-image {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin: 10px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    /* Reasoning Container */
    .reasoning-box {
      background: #111420;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .reasoning-header {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      user-select: none;
    }

    .reasoning-content {
      margin-top: 8px;
      white-space: pre-wrap;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    /* Action Buttons under Message */
    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .msg-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .msg-action-btn:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }

    /* Input Dock */
    .input-dock-container {
      padding: 16px 24px 24px 24px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }

    .input-box {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .input-box:focus-within {
      border-color: var(--accent-primary);
    }

    .image-preview-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .preview-thumb-container {
      position: relative;
      display: inline-block;
    }

    .preview-thumb {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .remove-thumb-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      max-height: 200px;
      min-height: 24px;
      line-height: 1.5;
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .send-btn {
      background: var(--accent-primary);
      color: #000;
      border: none;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .image-gen-shortcut {
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Modal / Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .toggle-sidebar-btn {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <i class="fa-solid fa-brain"></i> slxa
        <span class="brand-badge">Solo Dev</span>
      </div>
      <button class="icon-btn" id="close-sidebar-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <button class="new-chat-btn" id="new-chat-btn">
      <i class="fa-solid fa-plus"></i> New Chat
    </button>

    <div class="chat-history" id="chat-history"></div>

    <div class="sidebar-footer">
      <div class="creator-tag">
        <i class="fa-solid fa-code"></i> Created by Eyob
      </div>
      <div class="social-links">
        <a href="https://www.tiktok.com/@slxa19" target="_blank"><i class="fa-brands fa-tiktok"></i> @slxa19</a>
        <a href="https://www.instagram.com/slxa19" target="_blank"><i class="fa-brands fa-instagram"></i> @slxa19</a>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="toggle-sidebar-btn" id="toggle-sidebar-btn"><i class="fa-solid fa-bars"></i></button>
        <select class="model-selector" id="model-select">
          <option value="openai">GPT-4o (OpenAI Vision & Math)</option>
          <option value="deepseek">DeepSeek R1 (Reasoning)</option>
          <option value="qwen">Qwen 2.5 Coder</option>
          <option value="mistral">Mistral Small</option>
          <option value="llama">Llama 3.3 70B</option>
        </select>
      </div>

      <div class="top-bar-actions">
        <button class="tts-toggle-btn" id="tts-toggle-btn">
          <i class="fa-solid fa-volume-high"></i> Voice: <span id="tts-status">OFF</span>
        </button>
      </div>
    </header>

    <div class="chat-container" id="chat-container"></div>

    <!-- Input Dock -->
    <div class="input-dock-container">
      <div class="input-box">
        <div class="image-preview-bar" id="image-preview-bar" style="display: none;"></div>
        <div class="input-row">
          <textarea id="user-input" rows="1" placeholder="Ask a homework question, algebra problem, or type '/image prompt' to draw..."></textarea>
          <div class="input-actions">
            <button class="image-gen-shortcut" id="image-mode-btn" title="Quick Image Generation">
              <i class="fa-solid fa-wand-magic-sparkles"></i> Draw
            </button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <button class="icon-btn" id="attach-btn" title="Upload Math Photo or Image">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <button class="send-btn" id="send-btn">
              <i class="fa-solid fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Image Lightbox -->
  <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="" alt="Enlarged view">
  </div>

  <script>
    // --- APP STATE & CONFIG ---
    const SYSTEM_PROMPT = `You are slxa, an intelligent AI homework assistant created strictly by a single individual named Eyob. 
- Creator Identity: You were created solely by Eyob (one single person, NOT a team or group).
- Introduction Rule: When introducing yourself or greeting for the first time, state: "I'm an AI that can help you with your homework. Follow My TikTok and Instagram : slxa19"
- Social Handles: TikTok & Instagram @slxa19.
- Math & Algebra Formatting Rules: Always format math formulas using proper standard LaTeX. 
  For inline math use single dollar signs: $x^2 + y^2 = r^2$ or $\\frac{a}{b}$. 
  For display/block math use double dollar signs:
  $$\\frac{x+1}{2} = 5$$
  Highlight final numerical answers inside \\boxed{...}. Always output stacked fractions like \\frac{a}{b} and never leave raw plain slash text for equations if stacked fractions make it clearer.
- Text to Image Capability: You can generate images! Tell users to ask you "draw..." or "generate an image of..." or start with "/image".`;

    let state = {
      chats: JSON.parse(localStorage.getItem('slxa_chats') || '[]'),
      currentChatId: localStorage.getItem('slxa_current_id') || null,
      ttsEnabled: localStorage.getItem('slxa_tts') === 'true',
      attachedImageBase64: null,
      isStreaming: false
    };

    // --- DOM ELEMENTS ---
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    const attachBtn = document.getElementById('attach-btn');
    const previewBar = document.getElementById('image-preview-bar');
    const modelSelect = document.getElementById('model-select');
    const ttsToggleBtn = document.getElementById('tts-toggle-btn');
    const ttsStatus = document.getElementById('tts-status');
    const chatHistory = document.getElementById('chat-history');
    const newChatBtn = document.getElementById('new-chat-btn');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const imageModeBtn = document.getElementById('image-mode-btn');

    // --- INITIALIZATION ---
    function init() {
      if (!state.chats.length) {
        createNewChat();
      } else if (!state.currentChatId || !state.chats.find(c => c.id === state.currentChatId)) {
        state.currentChatId = state.chats[0].id;
      }

      updateTTSUI();
      renderSidebarHistory();
      renderCurrentChat();
      setupEventListeners();
    }

    // --- EVENT LISTENERS ---
    function setupEventListeners() {
      userInput.addEventListener('input', autoResizeTextarea);
      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      sendBtn.addEventListener('click', handleSend);
      newChatBtn.addEventListener('click', () => createNewChat());

      attachBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFileSelect);

      ttsToggleBtn.addEventListener('click', () => {
        state.ttsEnabled = !state.ttsEnabled;
        localStorage.setItem('slxa_tts', state.ttsEnabled);
        updateTTSUI();
      });

      toggleSidebarBtn.addEventListener('click', () => sidebar.classList.add('open'));
      closeSidebarBtn.addEventListener('click', () => sidebar.classList.remove('open'));

      imageModeBtn.addEventListener('click', () => {
        if (!userInput.value.startsWith('/image ')) {
          userInput.value = '/image ' + userInput.value;
        }
        userInput.focus();
      });
    }

    function autoResizeTextarea() {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
    }

    function updateTTSUI() {
      if (state.ttsEnabled) {
        ttsToggleBtn.classList.add('active');
        ttsStatus.textContent = 'ON';
      } else {
        ttsToggleBtn.classList.remove('active');
        ttsStatus.textContent = 'OFF';
        window.speechSynthesis.cancel();
      }
    }

    // --- CHAT MANAGEMENT ---
    function createNewChat() {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New Homework Chat',
        messages: [
          {
            role: 'assistant',
            content: "I'm an AI that can help you with your homework. Follow My TikTok and Instagram : slxa19\n\nHow can I help you with your math, algebra, or studies today?"
          }
        ]
      };
      state.chats.unshift(newChat);
      state.currentChatId = newChat.id;
      saveState();
      renderSidebarHistory();
      renderCurrentChat();
    }

    function getCurrentChat() {
      return state.chats.find(c => c.id === state.currentChatId);
    }

    function saveState() {
      localStorage.setItem('slxa_chats', JSON.stringify(state.chats));
      localStorage.setItem('slxa_current_id', state.currentChatId);
    }

    function renderSidebarHistory() {
      chatHistory.innerHTML = '';
      state.chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `history-item ${chat.id === state.currentChatId ? 'active' : ''}`;
        item.innerHTML = `
          <span class="title"><i class="fa-regular fa-message"></i> ${escapeHtml(chat.title)}</span>
          <button class="delete-btn" title="Delete Chat"><i class="fa-solid fa-trash"></i></button>
        `;
        item.addEventListener('click', (e) => {
          if (e.target.closest('.delete-btn')) {
            e.stopPropagation();
            deleteChat(chat.id);
          } else {
            state.currentChatId = chat.id;
            saveState();
            renderSidebarHistory();
            renderCurrentChat();
            sidebar.classList.remove('open');
          }
        });
        chatHistory.appendChild(item);
      });
    }

    function deleteChat(id) {
      state.chats = state.chats.filter(c => c.id !== id);
      if (state.chats.length === 0) {
        createNewChat();
      } else {
        if (state.currentChatId === id) {
          state.currentChatId = state.chats[0].id;
        }
        saveState();
        renderSidebarHistory();
        renderCurrentChat();
      }
    }

    // --- FILE HANDLING ---
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        state.attachedImageBase64 = event.target.result;
        renderImagePreview();
      };
      reader.readAsDataURL(file);
    }

    function renderImagePreview() {
      if (!state.attachedImageBase64) {
        previewBar.style.display = 'none';
        previewBar.innerHTML = '';
        return;
      }
      previewBar.style.display = 'flex';
      previewBar.innerHTML = `
        <div class="preview-thumb-container">
          <img src="${state.attachedImageBase64}" class="preview-thumb">
          <button class="remove-thumb-btn" onclick="clearAttachedImage()"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `;
    }

    function clearAttachedImage() {
      state.attachedImageBase64 = null;
      fileInput.value = '';
      renderImagePreview();
    }

    // --- MATH SANITIZER & REAL-TIME PRE-PROCESSOR ---
    function preprocessMathAndMarkdown(text) {
      if (!text) return '';

      let processed = text;

      // Convert bracket math delimiters \[ ... \] and \( ... \) into KaTeX standard $$ and $
      processed = processed.replace(/\\\[([\s\S]*?)\\\]/g, '$$$$ $1 $$$$');
      processed = processed.replace(/\\\(([\s\S]*?)\\\)/g, '$$ $1 $$');

      // Auto-wrap raw LaTeX equations containing \frac, \sqrt, \boxed, \quad if not already inside $ or $$
      processed = processed.replace(/(?<!\$)(?<!\S)(\\boxed\{[^}]+\}|\\frac\{[^}]+\}\{[^}]+\}|\\sqrt\{[^}]+\})(?!\$)/g, '$$ $1 $$');

      // Slash-based fraction auto-converter for expressions like (x+1)/2 or 3/4 outside math tags
      processed = processed.replace(/(?<![\$\w\\])\(([^()]+)\)\/([0-9a-zA-Z]+)(?![\$\w])/g, '$$ \\frac{$1}{$2} $$');

      return processed;
    }

    // --- MESSAGE RENDERING ---
    function renderCurrentChat() {
      chatContainer.innerHTML = '';
      const chat = getCurrentChat();
      if (!chat) return;

      // Render Feature Banner if it's a short/new chat
      if (chat.messages.length <= 2) {
        const banner = document.createElement('div');
        banner.className = 'welcome-banner';
        banner.innerHTML = `
          <div class="banner-title"><i class="fa-solid fa-sparkles"></i> Welcome to slxa AI</div>
          <div class="banner-grid">
            <div class="banner-card"><i class="fa-solid fa-calculator"></i> Visual Algebra & Math Solver</div>
            <div class="banner-card"><i class="fa-solid fa-image"></i> AI Image Generator (/image)</div>
            <div class="banner-card"><i class="fa-solid fa-camera"></i> Photo Homework Analyzer</div>
            <div class="banner-card"><i class="fa-solid fa-user-astronaut"></i> Created by Solo Dev Eyob</div>
          </div>
        `;
        chatContainer.appendChild(banner);
      }

      chat.messages.forEach((msg, idx) => {
        appendMessageUI(msg.role, msg.content, msg.image, msg.reasoning, idx);
      });

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendMessageUI(role, content, image = null, reasoning = null, index = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

      const body = document.createElement('div');
      body.className = 'message-body';

      const sender = document.createElement('div');
      sender.className = 'sender-name';
      sender.textContent = role === 'user' ? 'You' : 'slxa AI';

      body.appendChild(sender);

      // Reasoning box for thinking models
      if (reasoning) {
        const reasonBox = document.createElement('div');
        reasonBox.className = 'reasoning-box';
        reasonBox.innerHTML = `
          <div class="reasoning-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
            <i class="fa-solid fa-brain"></i> Thinking Process...
          </div>
          <div class="reasoning-content" style="display: none;">${escapeHtml(reasoning)}</div>
        `;
        body.appendChild(reasonBox);
      }

      // Main Content Block
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      // Parse text/markdown & math
      const formattedText = preprocessMathAndMarkdown(content);
      contentDiv.innerHTML = marked.parse(formattedText);

      body.appendChild(contentDiv);

      // Attached Image or Image Generation Display
      if (image) {
        const imgEl = document.createElement('img');
        imgEl.className = 'message-image';
        imgEl.src = image;
        imgEl.onclick = () => openLightbox(image);
        body.appendChild(imgEl);
      }

      // Actions under Assistant Messages
      if (role === 'assistant') {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        
        const speakBtn = document.createElement('button');
        speakBtn.className = 'msg-action-btn';
        speakBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Listen';
        speakBtn.onclick = () => speakText(content);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'msg-action-btn';
        copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(content);
          copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
          setTimeout(() => copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy', 2000);
        };

        actions.appendChild(speakBtn);
        actions.appendChild(copyBtn);
        body.appendChild(actions);
      }

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(body);
      chatContainer.appendChild(msgDiv);

      // Render KaTeX Math
      renderMathInElement(contentDiv, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });

      // Highlight Code
      contentDiv.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      return { msgDiv, contentDiv, body };
    }

    // --- SEND & STREAMING LOGIC ---
    async function handleSend() {
      const text = userInput.value.trim();
      const attachedImg = state.attachedImageBase64;

      if (!text && !attachedImg) return;
      if (state.isStreaming) return;

      const chat = getCurrentChat();

      // Check if user is requesting Image Generation directly
      if (text.toLowerCase().startsWith('/image ') || text.toLowerCase().startsWith('generate an image') || text.toLowerCase().startsWith('draw ')) {
        await handleImageGeneration(text);
        return;
      }

      // Update Chat Title on first query
      if (chat.messages.length <= 1) {
        chat.title = text.slice(0, 30) || 'Image Problem';
        renderSidebarHistory();
      }

      // Push User Message
      const userMsg = { role: 'user', content: text, image: attachedImg };
      chat.messages.push(userMsg);

      // Reset Inputs
      userInput.value = '';
      autoResizeTextarea();
      clearAttachedImage();

      renderCurrentChat();
      state.isStreaming = true;
      sendBtn.disabled = true;

      // Prepare AI Message UI placeholder
      const { msgDiv, contentDiv, body } = appendMessageUI('assistant', '...');
      chatContainer.scrollTop = chatContainer.scrollHeight;

      let fullResponse = '';
      let reasoningContent = '';
      let reasoningBoxEl = null;

      try {
        const payloadMessages = [
          { role: 'system', content: SYSTEM_PROMPT }
        ];

        // Attach previous chat context
        chat.messages.forEach(m => {
          if (m.image) {
            payloadMessages.push({
              role: m.role,
              content: [
                { type: 'text', text: m.content || 'Analyze this image:' },
                { type: 'image_url', image_url: { url: m.image } }
              ]
            });
          } else {
            payloadMessages.push({ role: m.role, content: m.content });
          }
        });

        const selectedModel = modelSelect.value;
        const response = await fetch('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: payloadMessages,
            model: selectedModel,
            stream: true
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith(':')) continue;
            if (trimmed === 'data: [DONE]') break;

            if (trimmed.startsWith('data: ')) {
              try {
                const json = JSON.parse(trimmed.slice(6));
                const delta = json.choices[0]?.delta || {};

                // Intercept reasoning / thinking deltas
                if (delta.reasoning || delta.thought) {
                  reasoningContent += (delta.reasoning || delta.thought);
                  if (!reasoningBoxEl) {
                    reasoningBoxEl = document.createElement('div');
                    reasoningBoxEl.className = 'reasoning-box';
                    reasoningBoxEl.innerHTML = `
                      <div class="reasoning-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
                        <i class="fa-solid fa-brain"></i> Thinking Process...
                      </div>
                      <div class="reasoning-content">${escapeHtml(reasoningContent)}</div>
                    `;
                    body.insertBefore(reasoningBoxEl, contentDiv);
                  } else {
                    reasoningBoxEl.querySelector('.reasoning-content').textContent = reasoningContent;
                  }
                }

                // Append regular response deltas
                if (delta.content) {
                  fullResponse += delta.content;
                  const formatted = preprocessMathAndMarkdown(fullResponse);
                  contentDiv.innerHTML = marked.parse(formatted);

                  renderMathInElement(contentDiv, {
                    delimiters: [
                      {left: '$$', right: '$$', display: true},
                      {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                  });
                }
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } catch (err) {
                // Ignore chunk parse errors
              }
            }
          }
        }

        // Finalize Assistant Message
        const assistantMsg = {
          role: 'assistant',
          content: fullResponse,
          reasoning: reasoningContent || null
        };
        chat.messages.push(assistantMsg);
        saveState();

        if (state.ttsEnabled) {
          speakText(fullResponse);
        }

      } catch (error) {
        contentDiv.innerHTML = `<p style="color: #ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> Error connecting to AI. Please try again.</p>`;
      } finally {
        state.isStreaming = false;
        sendBtn.disabled = false;
        renderCurrentChat();
      }
    }

    // --- TEXT TO IMAGE GENERATION ---
    async function handleImageGeneration(promptText) {
      let cleanPrompt = promptText.replace(/^\/image\s*/i, '').replace(/^generate an image of\s*/i, '').replace(/^draw\s*/i, '');
      if (!cleanPrompt) cleanPrompt = 'colorful abstract homework math pattern';

      const chat = getCurrentChat();
      chat.messages.push({ role: 'user', content: promptText });

      userInput.value = '';
      renderCurrentChat();

      state.isStreaming = true;
      sendBtn.disabled = true;

      const encodedPrompt = encodeURIComponent(cleanPrompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;

      const assistantMsg = {
        role: 'assistant',
        content: `Here is the image generated for: **"${escapeHtml(cleanPrompt)}"**`,
        image: imageUrl
      };

      chat.messages.push(assistantMsg);
      saveState();

      setTimeout(() => {
        state.isStreaming = false;
        sendBtn.disabled = false;
        renderCurrentChat();
      }, 1000);
    }

    // --- TEXT TO SPEECH ---
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      // Clean Markdown tags and Math equations before reading
      const cleanText = text
        .replace(/\$\$[\s\S]*?\$\$/g, ' mathematical equation ')
        .replace(/\$.*?\$/g, ' equation ')
        .replace(/[*_#`~]/g, '')
        .replace(/\[.*?\]\(.*?\)/g, '');

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
      if (preferredVoice) utterance.voice = preferredVoice;

      window.speechSynthesis.speak(utterance);
    }

    // --- UTILS ---
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      lbImg.src = src;
      lb.style.display = 'flex';
    }

    // Run Initialization
    init();
  </script>
</body>
